<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" fill="none">
  <!-- Ocean -->
  <ellipse cx="80" cy="118" rx="68" ry="28" fill="#38b8e8" stroke="#1a1008" stroke-width="4.5"/>
  <!-- Wave crest highlight -->
  <path d="M18 106 Q40 98 62 106 Q84 114 106 106 Q128 98 148 106"
        stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Boat hull -->
  <path d="M44 82 L40 104 Q58 118 80 118 Q102 118 120 104 L116 82 Z"
        fill="#c07830" stroke="#1a1008" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Inner hull (lighter wood) -->
  <path d="M50 82 L47 102 Q62 114 80 114 Q98 114 113 102 L110 82 Z"
        fill="#d8923c"/>
  <!-- Deck line -->
  <line x1="44" y1="82" x2="116" y2="82" stroke="#1a1008" stroke-width="4" stroke-linecap="round"/>

  <!-- Mast -->
  <rect x="77" y="18" width="6" height="66" rx="2"
        fill="#7a4e24" stroke="#1a1008" stroke-width="3"/>
  <!-- Main sail (right) -->
  <path d="M82 20 L82 78 L114 60 Z"
        fill="white" stroke="#1a1008" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Jib (left, smaller) -->
  <path d="M78 28 L78 70 L50 55 Z"
        fill="#f8efd8" stroke="#1a1008" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Gold flag -->
  <path d="M80 18 L80 34 L98 26 Z"
        fill="#ffd24a" stroke="#1a1008" stroke-width="2.5" stroke-linejoin="round"/>
</svg>